</head>

        <div class="d_headerGrid">
            <!-- company name -->
            <div class="d_headerCompany">

            </div>

            <!-- home link -->
            <div class="d_headerLink" id="d_headerLinkHome">
                <a class="a_change" href="index.html">Home</a>
            </div>

            <!-- current link-->
            <div class="d_headerLink" id="d_headerLinkView">
                <a class="a_current">View</a>

                <!-- Drop down links -->
                <div id="d_dropDownLinks">
                    <ul id="ul_dropDownLinks">
                        <!-- small -->
                        <li class="li_dropDownLinks">
                            <a class="a_dropDown" href="smallSwanPlants.html">Small</a>
                        </li>
                        <!-- medium -->
                        <li class="li_dropDownLinks">
                            <a class="a_dropDown" href="mediumSwanPlants.html">Medium</a>

                        <!-- large -->
                        <li class="li_dropDownLinks">
                            <a class="a_dropDown" href="largeSwanPlants.html">Large</a>
                        </li>
                        <!-- extra large -->
                        <li class="li_dropDownLinks">
                            <a class="a_dropDown" href="extraLargeSwanPlants.html">Extra Large</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- care link -->
            <div class="d_headerLink" id="d_headerLinkCare">

    <div id="d_viewPlantsGrid">

        <div id="d_smallSwanPlant" class="d_viewSwanPlants" onclick="window.location.href='smallSwanPlants.html';">

            <div class="d_swanPlantsImage d_alignCenterVertHori">

            <div class="d_swanPlantsPrice d_alignCenterVertHori">

        <!-- Medium Swan plant -->
        <div id="d_mediumSwanPlant" class="d_viewSwanPlants" onclick="window.location.href='mediumSwanPlants.html';">

        <div id="d_largeSwanPlant" class="d_viewSwanPlants" onclick="window.location.href='largeSwanPlants.html';">
            <!-- image -->
            <div class="d_swanPlantsImage d_alignCenterVertHori">
                <img id="i_largeSwanPlant" class="i_swanPlant" alt="Large swan plant image"
                    src="images/swanPlants/largeSwanPlants.JPG">
            </div>
            <!-- header -->
            <div class="d_swanPlantsHeader d_alignCenterVertHori">
                <h3 class="h3_swanPlant">Large swan plant</h3>
            </div>

            <div class="d_swanPlantsPrice d_alignCenterVertHori">
                <h3 class="h3_swanPlant">$7 each</h3>

        <div id="d_extraLargeSwanPlant" class="d_viewSwanPlants"
            onclick="window.location.href='extraLargeSwanPlants.html';">
            <!-- image -->
            <div class="d_swanPlantsImage d_alignCenterVertHori">
                <img id="i_extraLargeSwanPlant" class="i_swanPlant" alt="Extra large swan plant image"

            </div>
            <!-- header -->
            <div class="d_swanPlantsHeader d_alignCenterVertHori">
                <h3 class="h3_swanPlant">Extra large swan plant</h3>
            </div>
            <!-- price -->
            <div class="d_swanPlantsPrice d_alignCenterVertHori">

            <div class="d_footerLinkGrid"> <a class="a_footer" href="order.html">Order</a></div>
            <div class="d_contactUsGrid">

                <div id="d_contactUsBackground">

                        <a id="a_contactEmail" class="a_contact" target="_blank"

                    </div>
                    <!-- phone contact -->
                    <div id="d_contactPhone" class="d_alignCenterVertHori">
                        <img id="a_contactPhone" class="i_contactIcon" alt="phone icon" src="images/phoneIcon.png">
                        <a class="a_contact" target="_blank" href="tel:+640272546046">
                            +64 027 254 6046</a>
                    </div>
                </div>
            </div>
            <!-- Back to top -->
            <div id="d_backToTopGrid">
